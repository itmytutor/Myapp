name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Accept Licenses
        run: |
          ANDROID_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_PATH" >> $GITHUB_ENV
          echo "$ANDROID_PATH/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_PATH/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_PATH/cmdline-tools/latest/bin:$ANDROID_PATH/platform-tools:$PATH"
          export ANDROID_HOME="$ANDROID_PATH"

          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses || true

          echo "Ensuring Android SDK Platform 35 and Build Tools are installed..."
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

          mkdir -p android
          echo "sdk.dir=$ANDROID_PATH" > android/local.properties
          echo "Configured android/local.properties:"
          cat android/local.properties

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            echo "package-lock.json detected. Installing with npm ci..."
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            echo "No lock file detected. Installing with npm install..."
            npm install --legacy-peer-deps
          fi

      - name: Build Web Application
        run: |
          npm run build

      - name: Prepare Capacitor Android Scaffolding
        env:
          CI: true
          CAPACITOR_TELEMETRY_ENABLED: 'false'
        run: |
          # Grant executable permissions to gradlew before Capacitor runs any tasks
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

          # Only initialize native Android project if the android folder does not exist
          if [ ! -d "android" ]; then
            echo "Initializing native Android project..."
            npx cap add android
            chmod +x android/gradlew
          fi

          echo "Syncing web assets to native Android project..."
          npx cap sync android || npx cap copy android

          # Ensure assets are present in public directory
          if [ ! -f "android/app/src/main/assets/public/index.html" ]; then
            echo "Fallback: Copying web assets to native Android assets directory..."
            mkdir -p android/app/src/main/assets/public
            cp -r dist/* android/app/src/main/assets/public/
          fi

          # Ensure gradlew remains executable
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android Debug APK
        if: github.event.inputs.build_type != 'release'
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          mkdir -p output-apk
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/myTutor-debug.apk
          else
            find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output-apk/myTutor-debug.apk \;
          fi
          echo "Debug APK ready:"
          ls -lh output-apk/

      - name: Build Android Release APK (Unsigned)
        if: github.event.inputs.build_type == 'release'
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
          cd ..
          mkdir -p output-apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output-apk/ \;
          echo "Release APK ready:"
          ls -lh output-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myTutor-Android-APK
          path: output-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Generate Job Summary
        run: |
          echo "### 📱 Android APK Build Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Application** | myTutor |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package ID** | \`com.mytutor.app\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | \`${{ github.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📥 How to Install on Your Android Device:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Summary** page of this GitHub Actions run." >> $GITHUB_STEP_SUMMARY
          echo "2. Download the **myTutor-Android-APK** artifact zip file." >> $GITHUB_STEP_SUMMARY
          echo "3. Extract the \`.apk\` file onto your Android phone or tablet." >> $GITHUB_STEP_SUMMARY
          echo "4. Tap the file to install (enable **Install unknown apps** in Android Settings if prompted)." >> $GITHUB_STEP_SUMMARY
