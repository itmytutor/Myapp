name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Prepare Capacitor Android Scaffolding
        run: |
          if [ ! -d "android" ]; then
            echo "Creating native Android project..."
            npx cap add android
          fi
          echo "Syncing web assets to native Android project..."
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/myTutor-debug.apk
          echo "APK successfully built at output-apk/myTutor-debug.apk"
          ls -lh output-apk/myTutor-debug.apk

      - name: Build Android Release APK (Unsigned)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
          cd ..
          mkdir -p output-apk
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output-apk/myTutor-release-unsigned.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output-apk/myTutor-release.apk
          fi
          ls -lh output-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myTutor-Android-APK
          path: output-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Generate Job Summary
        run: |
          echo "### 📱 Android APK Build Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Application** | myTutor |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package ID** | \`com.mytutor.app\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | \`${{ github.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📥 How to Install on Your Android Device:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Summary** page of this GitHub Actions run." >> $GITHUB_STEP_SUMMARY
          echo "2. Download the **myTutor-Android-APK** artifact zip file." >> $GITHUB_STEP_SUMMARY
          echo "3. Extract \`myTutor-debug.apk\` onto your Android phone or tablet." >> $GITHUB_STEP_SUMMARY
          echo "4. Tap the file to install (enable **Install unknown apps** in Android Settings if prompted)." >> $GITHUB_STEP_SUMMARY
